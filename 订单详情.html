<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>订单详情</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: #e9e9e9;
    color: #1a1a1a;
    -webkit-font-smoothing: antialiased;
  }
  button { border: none; background: none; cursor: pointer; font-family: inherit; }

  .page {
    max-width: 414px;
    margin: 0 auto;
    min-height: 100vh;
    background: #F5F5F5;
    padding-bottom: 84px;
    position: relative;
  }
  .nav {
    display: flex; align-items: center;
    padding: 14px 14px;
    background: #fff;
    position: sticky; top: 0; z-index: 50;
  }
  .nav-btn { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #F0F0F0; }
  .nav-btn svg { width: 18px; height: 18px; color: #333; }
  .nav-title { flex: 1; text-align: center; font-size: 17px; font-weight: 600; letter-spacing: 1px; color: #1a1a1a; }

  /* 金额卡 */
  .amount-card {
    margin: 14px 14px 0;
    background: linear-gradient(120deg, #6B7B3C, #4A5D23);
    border-radius: 14px;
    padding: 18px 18px;
    color: #fff;
  }
  .amount-label { font-size: 12px; opacity: .85; }
  .amount-pay { font-size: 30px; font-weight: 700; margin-top: 4px; }
  .amount-pay .yen { font-size: 18px; margin-right: 2px; }
  .amount-save { margin-top: 6px; font-size: 12px; opacity: .9; }
  .amount-save b { font-size: 14px; } 

  /* 通用区块 */
  .block {
    margin: 14px 14px 0;
    background: #fff;
    border-radius: 14px;
    padding: 15px 15px;
    box-shadow: 0 2px 10px rgba(0,0,0,.04);
  }
  .block-head { font-size: 15px; font-weight: 700; color: #1a1a1a; margin-bottom: 12px; display: flex; align-items: center; }
  .block-head::before { content: ''; width: 4px; height: 14px; border-radius: 2px; background: #6B7B3C; margin-right: 8px; }

  /* 订单/下级信息 */
  .info-row { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; }
  .info-row .k { color: #999; }
  .info-row .v { color: #333; font-weight: 600; }
  .info-row .v.hl { color: #D9820B; font-weight: 700; }

  /* 收款方式 tab */
  .pay-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .pay-tab {
    flex: 1; text-align: center; padding: 9px 0; font-size: 13px; font-weight: 600;
    border-radius: 9px; background: #F3F3F3; color: #888;
    transition: all .15s;
  }
  .pay-tab.active { background: #6B7B3C; color: #fff; }
  .pay-panel { display: none; }
  .pay-panel.active { display: block; }

  /* 收款码图片 */
  .qr-box { text-align: center; }
  .qr-img {
    width: 178px; height: 178px; margin: 4px auto 10px;
    background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 8px;
  }
  .qr-img svg { width: 100%; height: 100%; display: block; }
  .qr-tip { font-size: 12px; color: #999; }
  .qr-tip b { color: #333; }

  /* 银行卡信息 */
  .bank-card {
    background: linear-gradient(120deg, #3b4a3a, #243d15);
    color: #fff; border-radius: 12px; padding: 18px 16px;
  }
  .bank-name { font-size: 14px; font-weight: 700; letter-spacing: 1px; }
  .bank-no { font-size: 19px; letter-spacing: 2px; margin-top: 12px; font-family: "SF Mono", Menlo, monospace; }
  .bank-foot { display: flex; justify-content: space-between; margin-top: 14px; font-size: 12.5px; opacity: .9; }

  /* 上传截图 */
  .upload-box {
    border: 1.5px dashed #CCC;
    border-radius: 10px;
    padding: 16px;
    text-align: center;
    color: #999; font-size: 13px;
    cursor: pointer;
    transition: border-color .15s;
  }
  .upload-box.active { border-color: #6B7B3C; }
  .upload-box svg { width: 28px; height: 28px; color: #aaa; display: block; margin: 0 auto 8px; }
  .upload-preview { display: none; width: 100%; border-radius: 10px; margin-top: 10px; }
  .upload-preview.show { display: block; }
  .uploaded-tip { display: none; font-size: 12px; color: #1F9D55; margin-top: 8px; align-items: center; gap: 5px; }
  .uploaded-tip.show { display: flex; }
  .uploaded-tip::before { content: '✓'; }

  /* 交易单号行 */
  .trade-row { display: flex; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px dashed #eee; }
  .trade-label { font-size: 13px; color: #333; font-weight: 600; flex-shrink: 0; margin-right: 12px; }
  .trade-label .req { color: #D9534F; }
  .trade-input {
    flex: 1; font-size: 13.5px; color: #1a1a1a;
    background: #F5F5F5; border-radius: 8px;
    padding: 10px 12px;
    min-width: 0;
    -webkit-user-select: auto; user-select: auto;
  }
  .trade-input::placeholder { color: #b0b0b0; }

  /* 收款码放大 */
  .qr-box { text-align: center; cursor: zoom-in; }
  .qr-img {
    width: 178px; height: 178px; margin: 4px auto 10px;
    background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 8px;
  }
  .qr-img svg { width: 100%; height: 100%; display: block; }
  .qr-img .pay-qr-img { width: 100%; height: 100%; object-fit: contain; display: none; }
  .qr-img.img svg { display: none; }
  .qr-img.img .pay-qr-img { display: block; }
  .qr-tip { font-size: 12px; color: #999; }
  .qr-tip b { color: #333; }
  .qr-enlarge { font-size: 11px; color: #B9C291; margin-top: 6px; }

  /* 收款码放大预览 */
  .viewer {
    position: fixed; inset: 0; z-index: 300;
    background: rgba(0,0,0,.88);
    display: none; align-items: center; justify-content: center; flex-direction: column;
    padding: 30px;
  }
  .viewer.show { display: flex; }
  .viewer-img { max-width: 310px; max-height: 310px; background: #fff; border-radius: 14px; padding: 12px; }
  .viewer-img img, .viewer-img svg { width: 100%; height: 100%; object-fit: contain; display: block; }
  .viewer-tip { color: #fff; margin-top: 16px; font-size: 15px; font-weight: 600; }
  .viewer-sub { color: rgba(255,255,255,.75); margin-top: 6px; font-size: 12px; }
  .viewer-close { margin-top: 22px; color: #fff; font-size: 13px; border: 1px solid rgba(255,255,255,.5); border-radius: 8px; padding: 8px 28px; }
  .viewer-close:active { background: rgba(255,255,255,.15); }

  /* 底部提交 */
  .footer-bar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 414px;
    background: #fff;
    border-top: 1px solid #eee;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    z-index: 60;
  }
  .submit-btn {
    width: 100%; padding: 14px 0; border-radius: 12px;
    background: #6B7B3C; color: #fff;
    font-size: 16px; font-weight: 700; letter-spacing: 2px;
    transition: transform .15s, opacity .15s;
  }
  .submit-btn:active { transform: scale(.98); }
  .submit-btn:disabled { background: #C8CCB8; cursor: default; }

  .toast {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%) translateY(8px);
    background: rgba(0,0,0,.72); color: #fff;
    font-size: 12.5px; padding: 9px 18px; border-radius: 20px;
    opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>

  ];
  function loadOrders() {
    var raw = localStorage.getItem(KEY);
    if (raw) { try { return JSON.parse(raw); } catch (e) {} }
    localStorage.setItem(KEY, JSON.stringify(SEED));
    return SEED.slice();
  }
  function saveOrders(list) { localStorage.setItem(KEY, JSON.stringify(list)); }

  var orders = loadOrders();
  var id = new URLSearchParams(location.search).get("id");
  var order = orders.find(function (o) { return o.id === id; });
  if (!order) order = orders[0];

  // ---------- 渲染下级订单信息 ----------
  var infoHtml =
    '<div class="info-row"><span class="k">订单号</span><span class="v">' + order.id + '</span></div>' +
    '<div class="info-row"><span class="k">下级客户</span><span class="v">' + order.cust + '</span></div>' +
    '<div class="info-row"><span class="k">下单时间</span><span class="v">' + order.date + '</span></div>' +
    '<div class="info-row"><span class="k">商品</span><span class="v">' + order.item + '</span></div>' +
    '<div class="info-row"><span class="k">分类</span><span class="v">' + order.cat + '</span></div>' +
    '<div class="info-row"><span class="k">下级下单金额</span><span class="v hl">¥' + order.down + '</span></div>' +
    '<div class="info-row"><span class="k">您应付采购款</span><span class="v hl">¥' + order.pay + '</span></div>';
  document.getElementById('orderInfo').innerHTML = infoHtml;
  document.getElementById('amountPay').textContent = order.pay;
  document.getElementById('amountDown').textContent = '¥' + order.down;

  // ---------- 读取店铺设置的自定义收款码 ----------
  try {
    var shop = JSON.parse(localStorage.getItem("gm_shop") || "null");
    if (shop) {
      if (shop.wxQr) { document.getElementById('wxPayImg').src = shop.wxQr; document.querySelector('#panel-wx .qr-img').classList.add('img'); }
      if (shop.aliQr) { document.getElementById('aliPayImg').src = shop.aliQr; document.querySelector('#panel-ali .qr-img').classList.add('img'); }
    }
  } catch (e) {}

  // ---------- 收款码点击放大 ----------
  var viewer = document.getElementById('viewer');
  var viewerBody = document.getElementById('viewerBody');
  var viewerTip = document.getElementById('viewerTip');
  function openViewer(kind) {
    var img = document.getElementById(kind === "wx" ? "wxPayImg" : "aliPayImg");
    var custom = img.src ? true : false;
    var box = img.parentNode;
    var tip = kind === "wx" ? "微信收款码" : "支付宝收款码";
    viewerBody.innerHTML = "";
    if (custom) {
      var i = document.createElement('img');
      i.src = img.src;
      viewerBody.appendChild(i);
    } else if (box && box.querySelector('svg')) {
      viewerBody.appendChild(box.querySelector('svg').cloneNode(true));
    } else {
      return;
    }
    viewerTip.textContent = tip;
    viewer.classList.add('show');
  }
  document.getElementById('wxPayImg').parentNode.addEventListener('click', function () { openViewer("wx"); });
  document.getElementById('aliPayImg').parentNode.addEventListener('click', function () { openViewer("ali"); });
  document.getElementById('viewerClose').addEventListener('click', function () { viewer.classList.remove('show'); });
  viewer.addEventListener('click', function (e) { if (e.target === viewer) viewer.classList.remove('show'); });

  // ---------- 支付方式切换 ----------
  document.querySelectorAll('.pay-tab').forEach(function (t) {
    t.addEventListener('click', function () {
      document.querySelectorAll('.pay-tab').forEach(function (x) { x.classList.remove('active'); });
      document.querySelectorAll('.pay-panel').forEach(function (x) { x.classList.remove('active'); });
      t.classList.add('active');
      document.getElementById('panel-' + t.getAttribute('data-pay')).classList.add('active');
    });
  });

  // ---------- 上传截图 ----------
  var fileInput = document.getElementById('fileInput');
  var preview = document.getElementById('preview');
  var uploadedTip = document.getElementById('uploadedTip');
  var hasUpload = false;
  document.getElementById('uploadBox').addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function () {
    var f = fileInput.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function (e) {
      preview.src = e.target.result;
      preview.classList.add('show');
      uploadedTip.classList.add('show');
      document.getElementById('uploadBox').classList.add('active');
      hasUpload = true;
      updateSubmit();
    };
    reader.readAsDataURL(f);
  });

  // ---------- 提交审核 ----------
  var submitBtn = document.getElementById('submitBtn');
  var tradeNo = document.getElementById('tradeNo');
  function updateSubmit() {
    if (order.status === "采购中" || order.status === "已采购") {
      submitBtn.disabled = true;
      submitBtn.textContent = order.status === "采购中" ? "等待平台审核" : "采购已完成";
    } else {
      submitBtn.disabled = !(hasUpload && tradeNo.value.trim());
      submitBtn.textContent = "提交审核";
    }
  }
  tradeNo.addEventListener('input', updateSubmit);

  var toast = document.getElementById('toast');
  var timer = null;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(timer);
    timer = setTimeout(function () { toast.classList.remove('show'); }, 1800);
  }

  submitBtn.addEventListener('click', function () {
    if (!hasUpload) { showToast("请先上传支付截图"); return; }
    if (!tradeNo.value.trim()) { showToast("请填写流水号"); return; }
    order.tradeNo = tradeNo.value.trim();
    order.status = "采购中";
    saveOrders(orders);
    showToast("支付凭证已提交，等待平台审核");
    setTimeout(function () { location.href = "订单管理.html?status=采购中"; }, 1200);
  });

  updateSubmit();
</script>
</body>
</html>
