<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>订单管理</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: #e9e9e9;
    color: #1a1a1a;
    -webkit-font-smoothing: antialiased;
  }
  button { border: none; background: none; cursor: pointer; font-family: inherit; }

  .page {
    max-width: 414px;
    margin: 0 auto;
    min-height: 100vh;
    background: #F5F5F5;
    padding-bottom: 40px;
    position: relative;
  }

  /* 顶部导航 */
  .nav {
    display: flex; align-items: center;
    padding: 14px 14px;
    background: #fff;
    position: sticky; top: 0; z-index: 50;
  }
  .nav-btn {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: #F0F0F0;
  }
  .nav-btn svg { width: 18px; height: 18px; color: #333; }
  .nav-title { flex: 1; text-align: center; font-size: 17px; font-weight: 600; letter-spacing: 1px; color: #1a1a1a; }

  /* 小红点提示条 */
  .pending-tip {
    margin: 12px 14px 0;
    background: #FFF6F6;
    border: 1px solid #F3D2D0;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px; color: #D9534F;
    display: flex; align-items: center; gap: 8px;
    display: none;
  }
  .pending-tip.show { display: flex; }
  .pending-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #E02F2F;
    flex-shrink: 0;
    animation: blink 1.2s infinite;
  }
  @keyframes blink { 50% { opacity: .3; } }

  /* 分类 Tab */
  .cat-tabs {
    display: flex;
    gap: 2px;
    overflow-x: auto;
    padding: 12px 14px 0;
    scrollbar-width: none;
  }
  .cat-tabs::-webkit-scrollbar { display: none; }
  .cat-tab {
    flex-shrink: 0;
    padding: 8px 13px;
    font-size: 13.5px; color: #888;
    background: #fff;
    border-radius: 20px;
    margin-right: 8px;
    border: 1px solid #eee;
    position: relative;
    transition: all .15s;
  }
  .cat-tab.active { color: #fff; background: #6B7B3C; border-color: #6B7B3C; font-weight: 600; }
  .cat-dot {
    position: absolute; top: -4px; right: -3px;
    min-width: 17px; height: 17px; padding: 0 4px;
    border-radius: 9px;
    background: #E02F2F; color: #fff;
    font-size: 11px; line-height: 17px; text-align: center;
    display: none;
  }
  .cat-dot.show { display: block; }

  /* 订单列表 */
  .order-list { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .order-card {
    background: #fff;
    border-radius: 14px;
    padding: 13px;
    box-shadow: 0 2px 10px rgba(0,0,0,.04);
  }
  .order-head {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 10px;
    border-bottom: 1px solid #F3F3F3;
  }
  .order-no { font-size: 12.5px; color: #333; font-weight: 600; }
  .status-badge { font-size: 11px; padding: 2px 9px; border-radius: 10px; }
  .st-待处理 { background: #FDE2E2; color: #D9534F; }
  .st-已处理 { background: #EAF0FB; color: #4A76D0; }
  .st-未采购 { background: #FFF4E0; color: #D9820B; }
  .st-采购中 { background: #FFF4E0; color: #D9820B; }
  .st-已采购 { background: #E4F4E9; color: #1F9D55; }

  .order-main { padding: 10px 0; display: flex; gap: 11px; }
  .order-img {
    width: 64px; height: 64px; border-radius: 9px; overflow: hidden;
    background: #f4f4f2; flex-shrink: 0;
  }
  .order-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .order-info { flex: 1; min-width: 0; }
  .order-cust { font-size: 13.5px; color: #222; font-weight: 600; }
  .order-meta { font-size: 11.5px; color: #999; margin-top: 4px; }
  .order-item { font-size: 12px; color: #555; margin-top: 4px; }
  .order-amount { margin-top: 7px; display: flex; align-items: center; gap: 12px; }
  .amt-down { font-size: 12px; color: #999; }
  .amt-down b { font-size: 14px; color: #222; }
  .amt-pay { font-size: 13px; color: #C81623; font-weight: 700; }

  .order-foot { display: flex; align-items: center; justify-content: space-between; padding-top: 10px; border-top: 1px solid #F3F3F3; }
  .order-foot .note { font-size: 12px; color: #999; }
  .action-btn {
    font-size: 13px; font-weight: 600;
    padding: 8px 20px; border-radius: 8px;
    transition: transform .15s;
  }
  .action-btn:active { transform: scale(.95); }
  .action-btn.primary { background: #6B7B3C; color: #fff; }
  .action-btn.outline { background: #fff; color: #D9820B; border: 1px solid #E8CE9C; }
  .action-btn.view { background: #fff; color: #4A76D0; border: 1px solid #C7D6F0; margin-right: 8px; }
  .action-btn.disabled { background: #F0F0F0; color: #aaa; cursor: default; }
  .order-foot .btns { display: flex; }

  .empty { text-align: center; color: #bbb; padding: 60px 0; font-size: 14px; }

  /* 凭证查看器 */
  .viewer { position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,.88); display: none; align-items: center; justify-content: center; flex-direction: column; padding: 26px; }
  .viewer.show { display: flex; }
  .viewer-head { width: 100%; max-width: 360px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .viewer-head .vt { color: #fff; font-size: 15px; font-weight: 600; }
  .viewer-head .vc { color: rgba(255,255,255,.85); font-size: 13px; border: 1px solid rgba(255,255,255,.5); border-radius: 8px; padding: 6px 18px; }
  .viewer-head .vc:active { background: rgba(255,255,255,.15); }
  .viewer-body { max-width: 340px; background: #fff; border-radius: 12px; padding: 10px; }
  .viewer-body img { width: 100%; display: block; border-radius: 6px; }
  .viewer-sub { color: rgba(255,255,255,.72); margin-top: 14px; font-size: 12px; text-align: center; }
</style>
</head>
<body>
<div class="page">

  <header class="nav">
    <button class="nav-btn" onclick="history.back()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="nav-title">订单管理</div>
  </header>

  <div class="pending-tip" id="pendingTip">
    <span class="pending-dot"></span>
    <span>您有 <b id="pendingCount">0</b> 个待处理订单，请及时处理</span>
  </div>

  <div class="cat-tabs" id="catTabs"></div>

  <section class="order-list" id="orderList"></section>

  <!-- 凭证查看器 -->
  <div class="viewer" id="viewer">
    <div class="viewer-head">
      <span class="vt" id="viewerTitle">下级支付凭证</span>
      <button class="vc" id="viewerClose">关闭</button>
    </div>
    <div class="viewer-body" id="viewerBody"></div>
    <div class="viewer-sub" id="viewerSub"></div>
  </div>

</div>

<script>
  // ---------- 数据 ----------
  var IMG = {
    sofa: "https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Nordic%20minimalist%20living%20room%20scene%2C%20light%20green%20fabric%20sofa%20with%20round%20solid%20wood%20coffee%20table%2C%20green%20plant%20and%20books%20on%20table%2C%20bright%20natural%20light%2C%20photorealistic%20furniture%20photography&image_size=square",
    skincare: "https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Skincare%20set%20of%20three%20cosmetic%20bottles%20with%20gold%20caps%2C%20toner%20lotion%20and%20cream%20bottles%2C%20fresh%20light%20green%20background%20with%20green%20leaves%2C%20clean%20high-end%20product%20photography&image_size=square",
    earbuds: "https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=White%20true%20wireless%20bluetooth%20earbuds%20with%20open%20charging%20case%2C%20minimalist%20product%20photography%20on%20pure%20white%20background%2C%20clean%20studio%20lighting&image_size=square",
    nuts: "https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Daily%20mixed%20nuts%20and%20dried%20fruits%20snack%2C%20almonds%20cashews%20and%20walnuts%20in%20white%20bowl%20beside%20kraft%20paper%20bag%2C%20bright%20fresh%20food%20photography&image_size=square",
    proof: "https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=smartphone%20mobile%20payment%20screenshot%2C%20WeChat%20transfer%20success%20screen%20showing%20amount%20399.00%20yuan%20paid%20to%20upstream%20merchant%2C%20transfer%20receipt%20detail%20with%20green%20checkmark%2C%20screenshot%20on%20white%20background%2C%20real%20phone%20UI&image_size=portrait_4_3"
  };

  // 状态流转：待处理 -> 已处理 -> 未采购 -> (去采购) -> 采购中 -> (平台审核) -> 已采购
  var SEED = [
    { id: "OR20260905001", cust: "李一",    item: "北欧简约实木茶几客厅家具",   cat: "家居生活", img: IMG.sofa,     down: "399.00", pay: "199.00", date: "2026-09-05 10:24", status: "待处理" },
    { id: "OR20260905002", cust: "王芳",    item: "真无线蓝牙耳机降噪运动耳机", cat: "数码配件", img: IMG.earbuds, down: "399.00", pay: "199.00", date: "2026-09-05 09:12", status: "待处理" },
    { id: "OR20260905003", cust: "张伟",    item: "保湿补水护肤套装水乳套装",   cat: "美妆护理", img: IMG.skincare,down: "399.00", pay: "199.00", date: "2026-09-05 08:35", status: "待处理" },
    { id: "OR20260905004", cust: "刘敏",    item: "每日坚果混合果干零食大礼包", cat: "食品饮料", img: IMG.nuts,     down: "399.00", pay: "199.00", date: "2026-09-05 08:02", status: "待处理" },
    { id: "OR20260904005", cust: "赵磊",    item: "北欧简约实木茶几客厅家具",   cat: "家居生活", img: IMG.sofa,     down: "399.00", pay: "199.00", date: "2026-09-04 22:47", status: "待处理" },
    { id: "OR20260904006", cust: "陈晨",    item: "真无线蓝牙耳机降噪运动耳机", cat: "数码配件", img: IMG.earbuds, down: "399.00", pay: "199.00", date: "2026-09-04 21:30", status: "待处理" },
    { id: "OR20260904007", cust: "孙丽",    item: "保湿补水护肤套装水乳套装",   cat: "美妆护理", img: IMG.skincare,down: "399.00", pay: "199.00", date: "2026-09-04 19:55", status: "待处理" },
    { id: "OR20260904008", cust: "周军",    item: "每日坚果混合果干零食大礼包", cat: "食品饮料", img: IMG.nuts,     down: "399.00", pay: "199.00", date: "2026-09-04 18:20", status: "待处理" },
    { id: "OR20260904009", cust: "吴丹",    item: "北欧简约实木茶几客厅家具",   cat: "家居生活", img: IMG.sofa,     down: "399.00", pay: "199.00", date: "2026-09-04 17:06", status: "待处理" },
    { id: "OR20260904010", cust: "郑强",    item: "真无线蓝牙耳机降噪运动耳机", cat: "数码配件", img: IMG.earbuds, down: "399.00", pay: "199.00", date: "2026-09-04 15:44", status: "待处理" },
    { id: "OR20260904011", cust: "王霞",    item: "保湿补水护肤套装水乳套装",   cat: "美妆护理", img: IMG.skincare,down: "399.00", pay: "199.00", date: "2026-09-04 14:12", status: "待处理" },
    { id: "OR20260904012", cust: "刘洋",    item: "每日坚果混合果干零食大礼包", cat: "食品饮料", img: IMG.nuts,     down: "399.00", pay: "199.00", date: "2026-09-04 13:38", status: "待处理" },
    { id: "OR20260904013", cust: "张敏",    item: "保湿补水护肤套装水乳套装",   cat: "美妆护理", img: IMG.skincare,down: "399.00", pay: "199.00", date: "2026-09-04 16:40", status: "未采购" },
    { id: "OR20260904014", cust: "刘强",    item: "每日坚果混合果干零食大礼包", cat: "食品饮料", img: IMG.nuts,     down: "399.00", pay: "199.00", date: "2026-09-04 14:05", status: "采购中" },
    { id: "OR20260903015", cust: "陈静",    item: "北欧简约实木茶几客厅家具",   cat: "家居生活", img: IMG.sofa,     down: "399.00", pay: "199.00", date: "2026-09-03 20:18", status: "已采购" },
    { id: "OR20260902016", cust: "徐芳",    item: "真无线蓝牙耳机降噪运动耳机", cat: "数码配件", img: IMG.earbuds, down: "399.00", pay: "199.00", date: "2026-09-02 11:09", status: "已采购" }
  ];
  var KEY = "gm_orders";
  var VER = "2"; // 种子版本，升级数据时自增以重新播种
  function loadOrders() {
    var raw = localStorage.getItem(KEY);
    if (raw && localStorage.getItem(KEY + "_v") === VER) {
      try { return JSON.parse(raw); } catch (e) {}
    }
    var list = SEED.map(function (o) { return Object.assign({}, o); });
    localStorage.setItem(KEY, JSON.stringify(list));
    localStorage.setItem(KEY + "_v", VER);
    return list;
  }
  function saveOrders(list) { localStorage.setItem(KEY, JSON.stringify(list)); }

  var orders = loadOrders();
  var STATUSES = ["全部", "待处理", "已处理", "未采购", "采购中", "已采购"];
  var current = "全部";
  // 从 URL 参数定位到指定状态
  var params = new URLSearchParams(location.search);
  if (params.get("status") && STATUSES.indexOf(params.get("status")) > -1) current = params.get("status");

  // ---------- 渲染 ----------
  function countBy(status) { return orders.filter(function (o) { return o.status === status; }).length; }

  function render() {
    var pending = countBy("待处理");

    // 小红点提示条
    var tip = document.getElementById('pendingTip');
    if (pending > 0) { tip.classList.add('show'); document.getElementById('pendingCount').textContent = pending; }
    else tip.classList.remove('show');

    // Tab
    var catHtml = "";
    STATUSES.forEach(function (s) {
      var n = countBy(s);
      catHtml += '<div class="cat-tab' + (s === current ? ' active' : '') + '" data-s="' + s + '">' + s +
        (s === "待处理" && pending > 0 ? '<span class="cat-dot show">' + pending + '</span>' : '') +
        '</div>';
    });
    document.getElementById('catTabs').innerHTML = catHtml;
    document.querySelectorAll('.cat-tab').forEach(function (el) {
      el.addEventListener('click', function () { current = el.getAttribute('data-s'); render(); });
    });

    // 列表
    var list = current === "全部" ? orders : orders.filter(function (o) { return o.status === current; });
    var html = "";
    if (!list.length) {
      html = '<div class="empty">暂无相关订单</div>';
    } else {
      list.forEach(function (o) {
        var btn = "";
        if (o.status === "待处理") btn = '<div class="btns"><button class="action-btn view" data-act="view" data-id="' + o.id + '">查看凭证</button><button class="action-btn primary" data-act="handle" data-id="' + o.id + '">确认处理</button></div>';
        else if (o.status === "未采购") btn = '<button class="action-btn outline" data-act="purchase" data-id="' + o.id + '">去采购</button>';
        else if (o.status === "已处理") btn = '<button class="action-btn outline" data-act="purchase" data-id="' + o.id + '">去采购</button>';
        else if (o.status === "采购中") btn = '<span class="action-btn disabled">等待平台审核</span>';
        else if (o.status === "已采购") btn = '<button class="action-btn outline" data-act="detail" data-id="' + o.id + '">查看订单详情</button>';

        var note = "";
        if (o.status === "待处理") note = "下级已支付，待确认";
        else if (o.status === "已处理") note = "已确认，待采购";
        else if (o.status === "未采购") note = "待采购";
        else if (o.status === "采购中") note = "支付截图平台审核中";
        else if (o.status === "已采购") note = "采购完成";

        html +=
          '<div class="order-card">' +
            '<div class="order-head">' +
              '<span class="order-no">订单号 ' + o.id + '</span>' +
              '<span class="status-badge st-' + o.status + '">' + o.status + '</span>' +
            '</div>' +
            '<div class="order-main">' +
              '<div class="order-img"><img src="' + o.img + '" alt=""></div>' +
              '<div class="order-info">' +
                '<div class="order-cust">下级：' + o.cust + ' · ' + o.cat + '</div>' +
                '<div class="order-meta">' + o.date + '</div>' +
                '<div class="order-item">' + o.item + '</div>' +
                '<div class="order-amount">' +
                  '<span class="amt-down">下级支付 <b>¥' + o.down + '</b></span>' +
                  '<span class="amt-pay">应付 ¥' + o.pay + '</span>' +
                '</div>' +
              '</div>' +
            '</div>' +
            '<div class="order-foot">' +
              '<span class="note">' + note + '</span>' +
              btn +
            '</div>' +
          '</div>';
      });
    }
    document.getElementById('orderList').innerHTML = html;

    // 事件
    document.querySelectorAll('[data-act]').forEach(function (b) {
      b.addEventListener('click', function () {
        var o = orders.find(function (x) { return x.id === b.getAttribute('data-id'); });
        var act = b.getAttribute('data-act');
        if (act === "handle") {
          o.status = "已处理"; saveOrders(orders);
          location.href = "未采购.html";
        } else if (act === "purchase") {
          location.href = "订单详情.html?id=" + o.id;
        } else if (act === "detail") {
          location.href = "采购详情.html?id=" + o.id;
        } else if (act === "view") {
          openViewer(o);
        }
      });
    });
  }

  // ---------- 查看下级支付凭证 ----------
  var viewer = document.getElementById('viewer');
  document.getElementById('viewerClose').addEventListener('click', function () { viewer.classList.remove('show'); });
  viewer.addEventListener('click', function (e) { if (e.target === viewer) viewer.classList.remove('show'); });
  function openViewer(o) {
    document.getElementById('viewerTitle').textContent = '下级 ' + o.cust + ' 的支付凭证';
    document.getElementById('viewerBody').innerHTML = '<img src="' + IMG.proof + '" alt="支付凭证">';
    document.getElementById('viewerSub').textContent = '订单 ' + o.id + ' · 下级支付 ¥' + o.down + ' · 上传于 ' + o.date;
    viewer.classList.add('show');
  }

  render();
</script>
</body>
</html>
