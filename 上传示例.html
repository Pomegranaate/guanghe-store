<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>上传示例</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: #e9e9e9;
    color: #1a1a1a;
    -webkit-font-smoothing: antialiased;
  }
  button { border: none; background: none; cursor: pointer; font-family: inherit; }

  .page {
    max-width: 414px;
    margin: 0 auto;
    min-height: 100vh;
    background: #F5F5F5;
    padding-bottom: 40px;
    position: relative;
  }
  .nav {
    display: flex; align-items: center;
    padding: 14px 14px;
    background: #fff;
    position: sticky; top: 0; z-index: 50;
  }
  .nav-btn { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #F0F0F0; }
  .nav-btn svg { width: 18px; height: 18px; color: #333; }
  .nav-title { flex: 1; text-align: center; font-size: 17px; font-weight: 600; letter-spacing: 1px; color: #1a1a1a; }

  .block {
    margin: 14px 14px 0;
    background: #fff;
    border-radius: 14px;
    padding: 15px;
    box-shadow: 0 2px 10px rgba(0,0,0,.04);
  }
  .block-head { font-size: 15px; font-weight: 700; color: #1a1a1a; margin-bottom: 12px; display: flex; align-items: center; }
  .block-head::before { content: ''; width: 4px; height: 14px; border-radius: 2px; background: #6B7B3C; margin-right: 8px; }

  .example-img { width: 100%; border-radius: 10px; display: block; background: #f4f4f2; }
  .example-tip {
    margin: 14px 14px 0; background: #F1F4E6; border-radius: 12px; padding: 12px 14px;
    font-size: 12.5px; color: #4A5D23; line-height: 1.8;
  }
</style>
</head>
<body>
<div class="page">
  <div class="nav">
    <button class="nav-btn" onclick="history.back()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="nav-title">上传示例</div>
  </div>

  <section class="block">
    <div class="block-head">店铺采购付款凭证实例图片</div>
    <img class="example-img" src="店铺采购付款凭证实例图片.png" alt="店铺采购付款凭证实例图片">
  </section>

  <div class="example-tip">请参考上图示例格式，上传您向平台支付采购货款的<b>转账凭证截图</b>及填写<b>交易单号</b>，用于提交平台审核。</div>
</div>
</body>
</html>
