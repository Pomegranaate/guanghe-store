<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>购物车</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: #e9e9e9;
    color: #1a1a1a;
    -webkit-font-smoothing: antialiased;
  }
  button { border: none; background: none; cursor: pointer; font-family: inherit; }

  .page { max-width: 414px; margin: 0 auto; min-height: 100vh; background: #F5F5F5; padding-bottom: 86px; position: relative; }

  .nav { display: flex; align-items: center; padding: 14px 14px; background: #fff; position: sticky; top: 0; z-index: 50; }
  .nav-btn { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #F0F0F0; }
  .nav-btn svg { width: 18px; height: 18px; color: #333; }
  .nav-title { flex: 1; text-align: center; font-size: 17px; font-weight: 600; letter-spacing: 1px; }

  .bundle-tip { margin: 14px 14px 0; background: #FFF9EC; border: 1px solid #F1E0BC; border-radius: 10px; padding: 10px 14px; font-size: 12.5px; color: #B07B1F; }
  .bundle-tip b { color: #D9820B; }

  .cart-list { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .cart-item {
    background: #fff; border-radius: 14px; padding: 13px;
    box-shadow: 0 2px 10px rgba(0,0,0,.04);
    display: flex; align-items: center; gap: 11px;
  }
  .ck {
    width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid #D6D6D6; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .ck.on { background: #6B7B3C; border-color: #6B7B3C; }
  .ck svg { width: 11px; height: 11px; display: none; }
  .ck.on svg { display: block; }
  .ci-img { width: 74px; height: 74px; border-radius: 10px; overflow: hidden; background: #f4f4f2; flex-shrink: 0; }
  .ci-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ci-info { flex: 1; min-width: 0; }
  .ci-name { font-size: 13.5px; color: #222; line-height: 1.4; }
  .ci-meta { font-size: 12px; color: #999; margin-top: 5px; }
  .ci-price { margin-top: 7px; color: #C81623; font-weight: 700; font-size: 16px; }
  .ci-price .yen { font-size: 12px; }
  .ci-right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; flex-shrink: 0; }
  .ci-del { color: #bbb; }
  .ci-del svg { width: 18px; height: 18px; }
  .step { display: flex; align-items: center; background: #F3F3F3; border-radius: 6px; overflow: hidden; }
  .step button { width: 26px; height: 26px; font-size: 16px; color: #555; line-height: 1; }
  .step button:active { background: #e6e6e6; }
  .step .num { min-width: 24px; text-align: center; font-size: 13px; color: #1a1a1a; }

  .cart-empty { text-align: center; color: #bbb; padding: 70px 0 30px; }
  .cart-empty svg { width: 64px; height: 64px; color: #D8D8D8; }
  .cart-empty p { margin-top: 12px; font-size: 13px; }
  .cart-empty a { display: inline-block; margin-top: 16px; background: #6B7B3C; color: #fff; font-size: 13px; padding: 9px 26px; border-radius: 20px; }

  .footer-bar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 414px;
    background: #fff; border-top: 1px solid #eee;
    padding: 11px 16px calc(11px + env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 10px;
    z-index: 100;
  }
  .all-ck { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #666; width: 74px; }
  .all-ck .ck { width: 18px; height: 18px; }
  .footer-sum { flex: 1; text-align: right; font-size: 12px; color: #666; }
  .footer-sum b { font-size: 20px; color: #C81623; }
  .settle-btn {
    min-width: 120px; padding: 12px 0; border-radius: 22px;
    background: linear-gradient(120deg, #6B7B3C, #4A5D23); color: #fff;
    font-size: 15px; font-weight: 700; letter-spacing: 1px;
    transition: transform .15s, opacity .15s;
  }
  .settle-btn:active { transform: scale(.97); }
  .settle-btn:disabled { opacity: .5; cursor: default; }

  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(8px); background: rgba(0,0,0,.72); color: #fff; font-size: 12.5px; padding: 9px 18px; border-radius: 20px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 999; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="page">

  <header class="nav">
    <button class="nav-btn" onclick="history.back()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="nav-title">购物车</div>
  </header>

  <div class="bundle-tip" id="bundleTip" style="display:none;">
    阖家草本健康套餐 · 满 <b>6 件</b> 合计 <b>¥399.00</b>
  </div>

  <section class="cart-list" id="cartList"></section>

  <div class="cart-empty" id="cartEmpty" style="display:none;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 8h12l1.1 12.2a.8.8 0 01-.8.9H5.7a.8.8 0 01-.8-.9L6 8z"/>
      <path d="M9 10.5V6a3 3 0 016 0v4.5"/>
    </svg>
    <p>购物车还是空的，快去选购吧</p>
    <a href="购物中心.html">去逛逛</a>
  </div>

  <div class="footer-bar" id="footerBar">
    <div class="all-ck" id="allCk">
      <div class="ck" id="allBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4L19 7"/></svg>
      </div>
      全选
    </div>
    <div class="footer-sum">合计 <b>¥<span id="sum">0.00</span></b><div style="font-size:11px;color:#999;margin-top:2px;">已选 <span id="selCount">0</span>/<span id="allCount">0</span> 件</div></div>
    <button class="settle-btn" id="settleBtn" disabled>立即结算</button>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
  var CART_KEY = "gm_cart";
  var UNIT = "66.50";
  var cart = loadCart();
  var sel = {};

  function loadCart() { try { return JSON.parse(localStorage.getItem(CART_KEY) || "[]"); } catch (e) { return []; } }
  function saveCart() { localStorage.setItem(CART_KEY, JSON.stringify(cart)); }
  function totalPieces() { return cart.reduce(function (s, it) { return s + (it.count || 1); }, 0); }

  cart.forEach(function (it) { sel[it.name] = true; });

  var toast = document.getElementById('toast');
  var timer = null;
  function showToast(m) { toast.textContent = m; toast.classList.add('show'); clearTimeout(timer); timer = setTimeout(function () { toast.classList.remove('show'); }, 1600); }
  function fmt(n) { return (n || 0).toFixed(2); }

  function render() {
    var list = document.getElementById('cartList');
    document.getElementById('bundleTip').style.display = cart.length ? 'block' : 'none';
    document.getElementById('cartEmpty').style.display = cart.length ? 'none' : 'block';
    document.getElementById('footerBar').style.display = cart.length ? 'flex' : 'none';

    var html = "";
    cart.forEach(function (it) {
      html +=
        '<div class="cart-item">' +
          '<div class="ck' + (sel[it.name] ? ' on' : '') + '" data-name="' + encodeURIComponent(it.name) + '">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4L19 7"/></svg>' +
          '</div>' +
          '<div class="ci-img"><img src="' + it.img + '" alt=""></div>' +
          '<div class="ci-info">' +
            '<div class="ci-name">' + it.name + '</div>' +
            '<div class="ci-meta">套餐单件</div>' +
            '<div class="ci-price"><span class="yen">¥</span>' + it.price + '</div>' +
          '</div>' +
          '<div class="ci-right">' +
            '<button class="ci-del" data-del="' + encodeURIComponent(it.name) + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2M6 7l1 13a1 1 0 001 1h8a1 1 0 001-1l1-13"/></svg></button>' +
            '<div class="step">' +
              '<button data-min="' + encodeURIComponent(it.name) + '">−</button>' +
              '<span class="num">' + (it.count || 1) + '</span>' +
              '<button data-add="' + encodeURIComponent(it.name) + '">+</button>' +
            '</div>' +
          '</div>' +
        '</div>';
    });
    list.innerHTML = html;

    if (!cart.length) { document.getElementById('sum').textContent = "0.00"; return; }

    var cnt = 0, amt = 0;
    cart.forEach(function (it) {
      if (sel[it.name]) { var c = it.count || 1; cnt += c; amt += c * parseFloat(it.price || UNIT); }
    });
    document.getElementById('selCount').textContent = cnt;
    document.getElementById('allCount').textContent = totalPieces();
    document.getElementById('sum').textContent = fmt(amt);
    document.getElementById('settleBtn').disabled = cnt === 0;
    var allSel = cart.every(function (it) { return sel[it.name]; });
    document.getElementById('allBtn').classList.toggle('on', allSel);
  }

  document.getElementById('cartList').addEventListener('click', function (e) {
    var t = e.target;
    var ck = t.closest('.ck');
    var del = t.closest('[data-del]');
    var add = t.closest('[data-add]');
    var min = t.closest('[data-min]');
    if (ck) {
      var name = decodeURIComponent(ck.getAttribute('data-name'));
      sel[name] = !sel[name];
      render();
    } else if (del) {
      var dn = decodeURIComponent(del.getAttribute('data-del'));
      cart = cart.filter(function (x) { return x.name !== dn; });
      delete sel[dn];
      saveCart();
      render();
    } else if (add) {
      var an = decodeURIComponent(add.getAttribute('data-add'));
      var ai = cart.find(function (x) { return x.name === an; });
      if (ai) { ai.count = (ai.count || 1) + 1; saveCart(); render(); }
    } else if (min) {
      var mn = decodeURIComponent(min.getAttribute('data-min'));
      var mi = cart.find(function (x) { return x.name === mn; });
      if (mi) {
        mi.count = (mi.count || 1) - 1;
        if (mi.count <= 0) { cart = cart.filter(function (x) { return x.name !== mn; }); delete sel[mn]; }
        saveCart(); render();
      }
    }
  });

  document.getElementById('allBtn').addEventListener('click', function () {
    var on = !this.classList.contains('on');
    cart.forEach(function (it) { sel[it.name] = on; });
    render();
  });

  document.getElementById('settleBtn').addEventListener('click', function () {
    var chosen = cart.filter(function (it) { return sel[it.name]; });
    if (!chosen.length) { showToast("请先勾选商品"); return; }
    var data = chosen.map(function (it) {
      return { name: it.name, img: it.img, price: it.price || UNIT, count: it.count || 1 };
    });
    var url = "下单.html?" +
      "totalQty=" + chosen.reduce(function (s, it) { return s + (it.count || 1); }, 0) +
      "&items=" + encodeURIComponent(JSON.stringify(data));
    location.href = url;
  });

  render();
</script>
</body>
</html>
