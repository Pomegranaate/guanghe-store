<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>店铺管理</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: #e9e9e9;
    color: #1a1a1a;
    -webkit-font-smoothing: antialiased;
  }
  a { text-decoration: none; color: inherit; }
  button { border: none; background: none; cursor: pointer; font-family: inherit; }

  .page {
    max-width: 414px;
    margin: 0 auto;
    min-height: 100vh;
    background: #F5F5F5;
    padding-bottom: 96px;
    position: relative;
  }

  /* ---------- 顶部导航 ---------- */
  .nav {
    position: absolute; top: 0; left: 0; right: 0; z-index: 60;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px;
    color: #fff;
  }
  .nav-btn {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.18);
  }
  .nav-btn svg { width: 18px; height: 18px; }
  .nav-title {
    position: absolute; left: 50%; transform: translateX(-50%);
    font-size: 16px; font-weight: 600; letter-spacing: 1px; text-shadow: 0 1px 4px rgba(0,0,0,.25);
  }

  /* ---------- 店铺头部 ---------- */
  .shop-hero {
    position: relative;
    padding: 64px 20px 62px;
    overflow: hidden;
    background: #243d15;
  }
  .shop-hero .bg {
    position: absolute; inset: 0;
    background-image: url('https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Cozy%20boutique%20interior%20with%20dark%20green%20wall%2C%20wooden%20desk%20with%20green%20plants%20and%20books%2C%20warm%20natural%20light%20through%20window%2C%20black%20pendant%20hanging%20lamp%2C%20moody%20elegant%20atmosphere%2C%20photorealistic&image_size=landscape_4_3');
    background-size: cover;
    background-position: center;
  }
  .shop-hero .mask {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(20,34,10,.5) 0%, rgba(24,40,12,.35) 45%, rgba(26,42,13,.66) 100%);
  }
  .shop-info { position: relative; display: flex; align-items: center; gap: 16px; }
  .shop-avatar {
    width: 78px; height: 78px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.9);
    object-fit: cover;
    background: #ddd;
    flex-shrink: 0;
    box-shadow: 0 4px 14px rgba(0,0,0,.28);
  }
  .shop-name { font-size: 20px; font-weight: 700; color: #fff; letter-spacing: .5px; }
  .shop-id { font-size: 12.5px; color: rgba(255,255,255,.82); margin-top: 4px; }
  .stars { display: flex; gap: 2px; margin-top: 9px; }
  .stars svg { width: 13px; height: 13px; }
  .star-txt { font-size: 11.5px; color: rgba(255,255,255,.9); margin-top: 5px; }

  /* ---------- 星级进度卡片 ---------- */
  .level-card {
    position: relative;
    z-index: 10;
    margin: -36px 14px 0;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 18px rgba(0,0,0,.07);
    padding: 18px 18px 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
  }
  .level-left { flex: 1; min-width: 0; }
  .level-label { font-size: 12px; color: #999; }
  .level-num { margin-top: 3px; color: #2D5016; font-weight: 700; }
  .level-num .cur { font-size: 30px; line-height: 1; }
  .level-num .total { font-size: 15px; color: #9aa08c; font-weight: 600; }
  .level-bar {
    margin-top: 9px;
    height: 7px; border-radius: 99px;
    background: #E8E8E8;
    overflow: hidden;
  }
  .level-bar-fill {
    height: 100%; width: 70%;
    border-radius: 99px;
    background: linear-gradient(90deg, #6B7B3C, #4A5D23);
    animation: grow 1s ease both;
  }
  @keyframes grow { from { width: 0; } to { width: 70%; } }
  .upgrade-btn {
    flex-shrink: 0;
    display: inline-block;
    text-decoration: none;
    background: #4A5D23;
    color: #fff;
    font-size: 14px; font-weight: 600;
    padding: 10px 18px;
    border-radius: 10px;
    letter-spacing: 1px;
    box-shadow: 0 4px 10px rgba(74,93,35,.35);
    transition: transform .15s;
  }
  .upgrade-btn:active { transform: scale(.95); }

  /* ---------- 功能入口 ---------- */
  .section-title {
    font-size: 17px; font-weight: 700; color: #1a1a1a;
    padding: 24px 20px 14px;
  }
  .func-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    background: #fff;
    border-radius: 16px;
    margin: 0 14px;
    padding: 18px 6px 16px;
    box-shadow: 0 2px 10px rgba(0,0,0,.04);
  }
  .func-item {
    display: flex; flex-direction: column; align-items: center; gap: 9px;
    transition: transform .15s;
  }
  .func-item:active { transform: scale(.94); }
  .func-item svg { width: 32px; height: 32px; color: #6B7B3C; }
  .func-item span { font-size: 12.5px; color: #555; }

  /* ---------- 底部导航 ---------- */
  .tabbar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 414px;
    background: #fff;
    border-top: 1px solid #eee;
    display: flex;
    padding: 7px 0 calc(14px + env(safe-area-inset-bottom));
    z-index: 100;
  }
  .tab {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 10px; color: #999;
  }
  .tab svg { width: 24px; height: 24px; }
  .tab.active { color: #6B7B3C; font-weight: 600; }
</style>
</head>
<body>
<div class="page">

  <!-- 顶部导航 -->
  <header class="nav">
    <button class="nav-btn" onclick="history.back()">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="nav-title">店铺管理</div>
    </header>

  <!-- 店铺头部 -->
  <section class="shop-hero">
    <div class="bg"></div>
    <div class="mask"></div>
    <div class="shop-info">
      <img class="shop-avatar" src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Boutique%20shop%20wooden%20shelves%20display%20with%20glass%20jars%20of%20natural%20skincare%20products%20and%20green%20plants%2C%20warm%20cozy%20store%20interior%2C%20photorealistic&image_size=square" alt="店铺头像">
      <div>
        <div class="shop-name">精品生活馆</div>
        <div class="shop-id">ID: 100234</div>
        <div class="stars">
          <svg viewBox="0 0 24 24"><path fill="#F5B301" d="M12 2l2.95 6.35 6.63.8-4.9 4.58 1.32 6.57L12 17.02l-5.99 3.28 1.32-6.57L2.42 9.15l6.63-.8L12 2z"/></svg>
          <svg viewBox="0 0 24 24"><path fill="#F5B301" d="M12 2l2.95 6.35 6.63.8-4.9 4.58 1.32 6.57L12 17.02l-5.99 3.28 1.32-6.57L2.42 9.15l6.63-.8L12 2z"/></svg>
          <svg viewBox="0 0 24 24"><path fill="#F5B301" d="M12 2l2.95 6.35 6.63.8-4.9 4.58 1.32 6.57L12 17.02l-5.99 3.28 1.32-6.57L2.42 9.15l6.63-.8L12 2z"/></svg>
          <svg viewBox="0 0 24 24"><path fill="#F5B301" d="M12 2l2.95 6.35 6.63.8-4.9 4.58 1.32 6.57L12 17.02l-5.99 3.28 1.32-6.57L2.42 9.15l6.63-.8L12 2z"/></svg>
          <svg viewBox="0 0 24 24"><path fill="#F5B301" d="M12 2l2.95 6.35 6.63.8-4.9 4.58 1.32 6.57L12 17.02l-5.99 3.28 1.32-6.57L2.42 9.15l6.63-.8L12 2z"/></svg>
          <svg viewBox="0 0 24 24"><path fill="#F5B301" d="M12 2l2.95 6.35 6.63.8-4.9 4.58 1.32 6.57L12 17.02l-5.99 3.28 1.32-6.57L2.42 9.15l6.63-.8L12 2z"/></svg>
          <svg viewBox="0 0 24 24"><path fill="#F5B301" d="M12 2l2.95 6.35 6.63.8-4.9 4.58 1.32 6.57L12 17.02l-5.99 3.28 1.32-6.57L2.42 9.15l6.63-.8L12 2z"/></svg>
          <svg viewBox="0 0 24 24"><path fill="none" stroke="rgba(255,255,255,.85)" stroke-width="1.6" d="M12 2l2.95 6.35 6.63.8-4.9 4.58 1.32 6.57L12 17.02l-5.99 3.28 1.32-6.57L2.42 9.15l6.63-.8L12 2z"/></svg>
          <svg viewBox="0 0 24 24"><path fill="none" stroke="rgba(255,255,255,.85)" stroke-width="1.6" d="M12 2l2.95 6.35 6.63.8-4.9 4.58 1.32 6.57L12 17.02l-5.99 3.28 1.32-6.57L2.42 9.15l6.63-.8L12 2z"/></svg>
          <svg viewBox="0 0 24 24"><path fill="none" stroke="rgba(255,255,255,.85)" stroke-width="1.6" d="M12 2l2.95 6.35 6.63.8-4.9 4.58 1.32 6.57L12 17.02l-5.99 3.28 1.32-6.57L2.42 9.15l6.63-.8L12 2z"/></svg>
        </div>
        <div class="star-txt">当前星级：7星</div>
      </div>
    </div>
  </section>

  <!-- 星级进度卡片 -->
  <section class="level-card">
    <div class="level-left">
      <div class="level-label">当前星级</div>
      <div class="level-num"><span class="cur">7</span><span class="total"> / 10</span></div>
      <div class="level-bar"><div class="level-bar-fill"></div></div>
    </div>
    <a class="upgrade-btn" href="购物中心.html">升级店铺</a>
  </section>

  <!-- 功能入口 -->
  <h2 class="section-title">店铺管理</h2>
  <section class="func-grid">
    <a class="func-item" href="商品管理.html">
      <svg viewBox="0 0 24 24">
        <path fill="currentColor" d="M6 7.5h12l1.2 13.1a.9.9 0 01-.9 1H5.7a.9.9 0 01-.9-1L6 7.5z"/>
        <path fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" d="M9 11V6a3 3 0 016 0v5"/>
      </svg>
      <span>商品管理</span>
    </a>
    <a class="func-item" href="订单管理.html" style="position:relative">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2.5H6a2 2 0 00-2 2v15a2 2 0 002 2h12a2 2 0 002-2V8.5l-6-6z"/>
        <path d="M14 2.5v6h6"/>
        <path d="M8.8 15.5l2 2 4-4"/>
      </svg>
      <span>订单管理</span>
      <span class="order-entry-dot" id="orderEntry"></span>
    </a>
    <a class="func-item" href="店铺设置.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M19.4 14.5a1.6 1.6 0 00.3 1.8l.1.1a1.9 1.9 0 11-2.7 2.7l-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5v.2a1.9 1.9 0 11-3.8 0v-.1a1.6 1.6 0 00-1-1.5 1.6 1.6 0 00-1.8.3l-.1.1a1.9 1.9 0 11-2.7-2.7l.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H3.5a1.9 1.9 0 110-3.8h.2a1.6 1.6 0 001.5-1 1.6 1.6 0 00-.3-1.8l-.1-.1a1.9 1.9 0 112.7-2.7l.1.1a1.6 1.6 0 001.8.3h.1a1.6 1.6 0 001-1.5v-.2a1.9 1.9 0 113.8 0v.2a1.6 1.6 0 001 1.5h.1a1.6 1.6 0 001.8-.3l.1-.1a1.9 1.9 0 112.7 2.7l-.1.1a1.6 1.6 0 00-.3 1.8v.1a1.6 1.6 0 001.5 1h.2a1.9 1.9 0 110 3.8h-.2a1.6 1.6 0 00-1.5 1z"/>
      </svg>
      <span>店铺设置</span>
    </a>
  </section>

  <!-- 底部导航 -->
  <nav class="tabbar">
    <a class="tab" href="首页.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 10.5L12 3.5l9 7"/>
        <path d="M5.5 9.5V20.5h13V9.5"/>
      </svg>
      <span>首页</span>
    </a>
    <a class="tab" href="购物中心.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 8h12l1.1 12.2a.8.8 0 01-.8.9H5.7a.8.8 0 01-.8-.9L6 8z"/>
        <path d="M9 10.5V6a3 3 0 016 0v4.5"/>
      </svg>
      <span>购物中心</span>
    </a>
    <a class="tab active" href="店铺管理.html">
      <svg viewBox="0 0 24 24">
        <path fill="currentColor" d="M4.5 9.8L6.2 3.8h11.6l1.7 6a2 2 0 01-3.9.8 2 2 0 01-3.6.4 2 2 0 01-3.6-.4 2 2 0 01-3.9-.8z"/>
        <path fill="currentColor" d="M5.5 12.7l.6 2.2V20.2h11.8v-5.3l.6-2.2-1 3.1v6.4H6.5v-6.4l-1-3.1z"/>
        <path fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" d="M9.5 20.2v-4h5v4"/>
      </svg>
      <span>店铺管理</span>
    </a>
    <a class="tab" href="我的.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="3.6"/>
        <path d="M4.5 20.5c1.4-3.6 4.2-5.4 7.5-5.4s6.1 1.8 7.5 5.4"/>
      </svg>
      <span>我的</span>
    </a>
  </nav>

  <!-- 家庭套餐引导 -->
  <div class="guide-mask" id="guideMask">
    <div class="guide-modal">
      <div id="guideStep1">
        <div class="guide-title">欢迎进入店铺管理</div>
        <div class="guide-sub">请选择您的家庭套餐开通情况</div>
        <div class="guide-opt" data-case="bought">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12.5l-8 7-8-7 8-7z"/><path d="M4.5 12.5V5.5a1 1 0 011-1h13a1 1 0 011 1v7"/></svg>
          <span>已购买家庭套餐</span>
        </div>
        <div class="guide-opt" data-case="not">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12.5l-8 7-8-7 8-7z"/><path d="M4.5 12.5V5.5a1 1 0 011-1h13a1 1 0 011 1v7"/></svg>
          <span>未购买家庭套餐</span>
        </div>
        <div class="guide-opt" data-case="order">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12.5l-8 7-8-7 8-7z"/><path d="M4.5 12.5V5.5a1 1 0 011-1h13a1 1 0 011 1v7"/></svg>
          <span>已购买家庭套餐，平台已生成订单</span>
        </div>
      </div>
      <div id="guideStep2" style="display:none">
        <div class="guide-msg" id="guideMsg"></div>
        <button id="guideBtn" class="guide-btn"></button>
      </div>
    </div>
  </div>
</div>

<style>
  .order-entry-dot {
    position: absolute; top: 6px; right: 8px;
    min-width: 9px; height: 9px; border-radius: 50%;
    background: #E02F2F;
    box-shadow: 0 0 0 3px #fff;
    display: none;
  }
  .order-entry-dot.show { display: block; }

  /* 家庭套餐引导 */
  .guide-mask {
    position: fixed; inset: 0; z-index: 400;
    background: rgba(0,0,0,.5);
    display: flex; align-items: center; justify-content: center;
    padding: 0 28px;
  }
  .guide-modal {
    width: 100%; max-width: 320px;
    background: #fff; border-radius: 16px;
    padding: 24px 20px 20px;
    text-align: center;
    animation: pop .2s ease;
    box-shadow: 0 10px 40px rgba(0,0,0,.2);
  }
  @keyframes pop { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .guide-title { font-size: 18px; font-weight: 700; color: #1a1a1a; }
  .guide-sub { font-size: 13px; color: #888; margin-top: 8px; line-height: 1.6; }
  .guide-opt {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 14px;
    padding: 13px 0;
    border-radius: 11px;
    background: #F3F6EF;
    color: #4A5D23; font-size: 14px; font-weight: 600;
    cursor: pointer;
    transition: all .15s;
  }
  .guide-opt svg { width: 20px; height: 20px; }
  .guide-opt:active { background: #E4EAD6; transform: scale(.98); }
  .guide-msg { font-size: 14px; color: #333; line-height: 1.8; }
  .guide-msg .hl { color: #4A5D23; font-weight: 700; }
  .guide-btn {
    width: 100%; margin-top: 20px;
    padding: 12px 0; border-radius: 11px;
    background: #6B7B3C; color: #fff;
    font-size: 15px; font-weight: 700; letter-spacing: 1px;
    transition: transform .15s;
  }
  .guide-btn:active { transform: scale(.98); }
</style>

<script>
  // 有待处理订单时，订单管理入口显示小红点
  try {
    var raw = localStorage.getItem("gm_orders");
    if (raw) {
      var list = JSON.parse(raw);
      var hasPending = list.some(function (o) { return o.status === "待处理"; });
      if (hasPending) {
        var entry = document.getElementById("orderEntry");
        if (entry) entry.classList.add("show");
      }
    }
  } catch (e) {}

  // ---------- 家庭套餐场景引导 ----------
  var guideMask = document.getElementById('guideMask');
  var step1 = document.getElementById('guideStep1');
  var step2 = document.getElementById('guideStep2');
  var guideMsg = document.getElementById('guideMsg');
  var guideBtn = document.getElementById('guideBtn');

  function showMsg(text, btnText, jump) {
    step1.style.display = 'none';
    step2.style.display = 'block';
    guideMsg.innerHTML = text;
    guideBtn.textContent = btnText;
    guideBtn.onclick = function () {
      if (jump) location.href = jump;
      else guideMask.style.display = 'none';
    };
  }

  document.querySelectorAll('.guide-opt').forEach(function (opt) {
    opt.addEventListener('click', function () {
      var c = opt.getAttribute('data-case');
      if (c === 'bought') {
        guideMask.style.display = 'none'; // 正常进入
      } else if (c === 'not') {
        showMsg('您尚未开通个人店铺，购买<span class="hl">【阖家草本健康套餐】</span>获得店铺开通权限', '知道了');
      } else if (c === 'order') {
        showMsg('您已获得个人店铺开通权限，现在可填写店铺信息，开通属于您的个人店铺', '去填写店铺信息', '店铺设置.html');
      }
    });
  });
</script>
</body>
</html>
