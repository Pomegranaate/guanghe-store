<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>首页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: #e9e9e9;
    color: #1a1a1a;
    -webkit-font-smoothing: antialiased;
  }
  a { text-decoration: none; color: inherit; }
  button { border: none; background: none; cursor: pointer; font-family: inherit; }

  .page {
    max-width: 414px;
    margin: 0 auto;
    min-height: 100vh;
    background: #fff;
    padding-bottom: 96px;
    position: relative;
  }

  /* ---------- 顶部标题 ---------- */
  .nav {
    position: sticky; top: 0; z-index: 50;
    background: rgba(255,255,255,.92);
    backdrop-filter: blur(10px);
    padding: 14px 16px 12px;
    text-align: center;
  }
  .nav h1 { font-size: 17px; font-weight: 600; letter-spacing: 1px; color: #1a1a1a; }

  /* ---------- Banner ---------- */
  .banner {
    margin: 12px 16px 0;
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    aspect-ratio: 16 / 9;
    background: #e8e4d8;
  }
  .banner img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .banner-text {
    position: absolute; left: 24px; top: 50%; transform: translateY(-54%);
    color: #2D5016;
  }
  .banner-text h2 {
    font-family: "Songti SC", "STSong", "SimSun", serif;
    font-size: 34px;
    font-weight: 700;
    line-height: 1.25;
    letter-spacing: 4px;
    text-shadow: 0 1px 8px rgba(255,255,255,.6);
  }
  .banner-text .divider {
    width: 44px; height: 1px;
    background: rgba(45,80,22,.65);
    margin: 12px 0 10px;
  }
  .banner-text p {
    font-size: 13px; letter-spacing: 3px; font-weight: 500;
    text-shadow: 0 1px 6px rgba(255,255,255,.6);
  }
  .banner-dots {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px;
  }
  .banner-dots span {
    width: 7px; height: 7px; border-radius: 50%;
    background: rgba(255,255,255,.55);
    border: 1px solid rgba(45,80,22,.35);
  }
  .banner-dots span.active { background: #2D5016; border-color: #2D5016; width: 18px; border-radius: 4px; }

  /* ---------- 功能宫格 ---------- */
  .grid-menu {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    padding: 18px 16px 4px;
  }
  .menu-card {
    background: #F5F5F3;
    border-radius: 12px;
    padding: 14px 6px 10px;
    display: flex; flex-direction: column; align-items: center;
    transition: transform .15s ease;
  }
  .menu-card:active { transform: scale(.96); }
  .menu-icon {
    width: 46px; height: 46px; border-radius: 50%;
    background: #2D5016;
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 -3px 6px rgba(0,0,0,.18);
  }
  .menu-icon svg { width: 24px; height: 24px; }
  .menu-name { font-size: 13px; font-weight: 600; color: #222; margin-top: 9px; }
  .menu-desc {
    margin-top: 4px;
    font-size: 10px; color: #999;
    display: flex; align-items: center; gap: 3px;
  }
  .menu-desc .arrow {
    width: 13px; height: 13px; border-radius: 50%;
    border: 1px solid #c9c9c9;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 8px; color: #6B7B3C; line-height: 1;
    padding-left: 1px;
  }

  /* ---------- 精选商品 ---------- */
  .section-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 24px 16px 12px;
  }
  .section-head h3 { font-size: 17px; font-weight: 700; color: #1a1a1a; letter-spacing: .5px; }
  .section-head a { font-size: 12px; color: #999; display: flex; align-items: center; }
  .section-head a svg { width: 12px; height: 12px; margin-left: 2px; }

  .prod-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding: 0 16px;
  }
  .prod-card { display: flex; flex-direction: column; }
  .prod-img {
    border-radius: 10px; overflow: hidden; aspect-ratio: 1;
    background: #f4f4f2; position: relative;
  }
  .prod-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .prod-name {
    font-size: 11px; color: #333; line-height: 1.4;
    margin-top: 7px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
    min-height: 31px;
  }
  .prod-price { font-size: 15px; font-weight: 700; color: #2D5016; margin-top: 3px; }
  .prod-price .yen { font-size: 11px; margin-right: 1px; }
  .prod-bottom { display: flex; align-items: flex-end; justify-content: space-between; margin-top: 2px; }
  .prod-sold { font-size: 10px; color: #999; margin-bottom: 5px; }
  .cart-btn {
    width: 28px; height: 28px; border-radius: 50%;
    background: #F1F1EC;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: transform .15s ease, background .15s ease;
  }
  .cart-btn:active { transform: scale(.88); background: #e0e4d4; }
  .cart-btn svg { width: 15px; height: 15px; color: #2D5016; }

  /* ---------- 底部导航 ---------- */
  .tabbar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 414px;
    background: #fff;
    border-top: 1px solid #eee;
    display: flex;
    padding: 7px 0 calc(14px + env(safe-area-inset-bottom));
    z-index: 100;
  }
  .tab {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 10px; color: #999;
    transition: color .15s;
  }
  .tab svg { width: 24px; height: 24px; }
  .tab.active { color: #2D5016; font-weight: 600; }

  /* toast */
  .toast {
    position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%) translateY(8px);
    background: rgba(0,0,0,.72); color: #fff;
    font-size: 12px; padding: 8px 16px; border-radius: 20px;
    opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="page">

  <!-- 顶部标题 -->
  <header class="nav"><h1>首页</h1></header>

  <!-- Banner -->
  <section class="banner">
    <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Bright%20cozy%20living%20room%20interior%20with%20olive%20green%20fabric%20sofa%2C%20round%20solid%20wood%20coffee%20table%2C%20floor%20lamp%20and%20green%20potted%20plants%2C%20natural%20sunlight%20from%20window%2C%20warm%20minimalist%20Scandinavian%20style%2C%20photorealistic%20interior%20photography&image_size=landscape_16_9" alt="品质生活">

    <a class="menu-card" href="javascript:void(0)">

        </svg>

    <a class="menu-card" href="javascript:void(0)">
      <div class="menu-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 4L2.5 8.5 12 13l9.5-4.5L12 4z"/>
          <path d="M6.5 10.8V15c0 1.4 2.5 2.8 5.5 2.8s5.5-1.4 5.5-2.8v-4.2"/>
          <path d="M21.5 8.5v5"/>
        </svg>
      </div>

      <div class="menu-desc">学习成长 <span class="arrow">›</span></div>
    </a>
    <a class="menu-card" href="javascript:void(0)">
      <div class="menu-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.5 8.5 0 01-8.5 8.5c-1.5 0-2.9-.4-4.1-1L3 20l1.1-5.1a8.5 8.5 0 1116.9-3.4z"/>
          <path d="M9.8 9.3a2.3 2.3 0 114.2 1.3c-.5.8-1.6 1.1-1.6 2.1"/>
          <path d="M12.3 14.8h.01"/>
        </svg>
      </div>
      <div class="menu-name">百问百答</div>
      <div class="menu-desc">解答疑惑 <span class="arrow">›</span></div>
    </a>
    <a class="menu-card" href="javascript:void(0)">
      <div class="menu-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7a2 2 0 012-2h4l2 2.5h8a2 2 0 012 2V17a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/>
          <path d="M7 12h7M7 15h4"/>
        </svg>
      </div>
      <div class="menu-name">素材圈</div>
      <div class="menu-desc">共享素材 <span class="arrow">›</span></div>
    </a>
  </section>

  <!-- 精选商品 -->
  <section>
    <div class="section-head">
      <h3>精选商品</h3>
      <a href="购物中心.html">查看更多

      </a>
    </div>
    <div class="prod-grid">
      <div class="prod-card">
        <div class="prod-img">
          <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Nordic%20minimalist%20living%20room%20scene%2C%20light%20green%20fabric%20sofa%20with%20round%20solid%20wood%20coffee%20table%2C%20green%20plant%20and%20books%20on%20table%2C%20bright%20natural%20light%2C%20photorealistic%20furniture%20photography&image_size=square" alt="北欧简约实木茶几客厅家具">

            </svg>
          </button>
        </div>
      </div>
      <div class="prod-card">
        <div class="prod-img">
          <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Skincare%20set%20of%20three%20cosmetic%20bottles%20with%20gold%20caps%2C%20toner%20lotion%20and%20cream%20bottles%2C%20fresh%20light%20green%20background%20with%20green%20leaves%2C%20clean%20high-end%20product%20photography&image_size=square" alt="保湿补水护肤套装水乳套装">
        </div>
        <div class="prod-name">保湿补水护肤套装水乳套装</div>
        <div class="prod-bottom">
          <div>
            <div class="prod-price"><span class="yen">¥</span>189.00</div>
            <div class="prod-sold">已售 532</div>
          </div>
          <button class="cart-btn" title="加入购物车">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 4h2l2.4 11.2a1 1 0 001 .8h9.4a1 1 0 001-.8L20 8H6"/>
              <circle cx="9.5" cy="20" r="1.4"/><circle cx="17.5" cy="20" r="1.4"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="prod-card">
        <div class="prod-img">
          <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=White%20true%20wireless%20bluetooth%20earbuds%20with%20open%20charging%20case%2C%20minimalist%20product%20photography%20on%20pure%20white%20background%2C%20clean%20studio%20lighting&image_size=square" alt="真无线蓝牙耳机降噪运动耳机">
        </div>

        <div class="prod-bottom">
          <div>
            <div class="prod-price"><span class="yen">¥</span>159.00</div>
            <div class="prod-sold">已售 334</div>
          </div>
          <button class="cart-btn" title="加入购物车">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 4h2l2.4 11.2a1 1 0 001 .8h9.4a1 1 0 001-.8L20 8H6"/>

        </div>
      </div>
    </div>
  </section>

  <!-- 底部导航 -->
  <nav class="tabbar">
    <a class="tab active" href="首页.html">
      <svg viewBox="0 0 24 24">
        <path fill="currentColor" d="M12 3.2L2.8 10h2.4v10.2H10v-5.7h4v5.7h4.8V10h2.4L12 3.2z"/>
      </svg>
      <span>首页</span>
    </a>
    <a class="tab" href="购物中心.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

    </a>
    <a class="tab" href="店铺管理.html">

  <div class="toast" id="toast">已加入购物车</div>
</div>

<script>
  // 加入购物车轻提示
  var toast = document.getElementById('toast');
  var timer = null;
  document.querySelectorAll('.cart-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      toast.classList.add('show');
      clearTimeout(timer);
      timer = setTimeout(function () { toast.classList.remove('show'); }, 1200);
    });
  });

  // Banner 圆点切换
  var dots = document.querySelectorAll('.banner-dots span');
  dots.forEach(function (d, i) {
    d.addEventListener('click', function () {
      dots.forEach(function (x) { x.classList.remove('active'); });
      d.classList.add('active');
    });
  });
</script>
</body>
</html>
