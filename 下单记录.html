<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>下单记录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: #e9e9e9;
    color: #1a1a1a;
    -webkit-font-smoothing: antialiased;
  }
  a { text-decoration: none; color: inherit; }
  button { border: none; background: none; cursor: pointer; font-family: inherit; }
  .page { max-width: 414px; margin: 0 auto; min-height: 100vh; background: #F5F5F5; padding-bottom: 40px; position: relative; }

  .nav { display: flex; align-items: center; padding: 14px 14px; background: #fff; position: sticky; top: 0; z-index: 50; }
  .nav-btn { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #F0F0F0; }
  .nav-btn svg { width: 18px; height: 18px; color: #333; }
  .nav-title { flex: 1; text-align: center; font-size: 17px; font-weight: 600; letter-spacing: 1px; color: #1a1a1a; }

  .list { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .card { background: #fff; border-radius: 14px; padding: 13px; box-shadow: 0 2px 10px rgba(0,0,0,.04); }
  .card-head { display: flex; align-items: center; justify-content: space-between; padding-bottom: 10px; border-bottom: 1px solid #F3F3F3; }
  .order-no { font-size: 12.5px; color: #333; font-weight: 600; }
  .status { font-size: 11px; padding: 2px 9px; border-radius: 10px; background: #FFF4E0; color: #D9820B; }
  .main { padding: 10px 0; display: flex; gap: 11px; }
  .img { width: 64px; height: 64px; border-radius: 9px; overflow: hidden; background: #f4f4f2; flex-shrink: 0; }
  .img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .info { flex: 1; min-width: 0; }
  .info .name { font-size: 13.5px; color: #222; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .info .meta { font-size: 12px; color: #999; margin-top: 6px; }
  .info .price { margin-top: 8px; font-size: 13px; color: #999; }
  .info .price b { font-size: 17px; color: #C81623; }
  .info .price b .yen { font-size: 12px; }

  .empty { text-align: center; padding: 70px 20px; color: #999; }
  .empty svg { width: 60px; height: 60px; color: #ccc; display: block; margin: 0 auto 16px; }
  .empty p { font-size: 13.5px; }
</style>
</head>
<body>
<div class="page">
  <header class="nav">
    <button class="nav-btn" onclick="history.back()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="nav-title">下单记录</div>
  </header>

  <div class="list" id="list"></div>

  <script>
    var list = [];
    try { list = JSON.parse(localStorage.getItem("gm_buyer_orders") || "[]"); } catch (e) {}
    var wrap = document.getElementById('list');
    if (!list.length) {
      wrap.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a1 1 0 001 .8h9.4a1 1 0 001-.8L20 8H6"/><circle cx="9.5" cy="20" r="1.4"/><circle cx="17.5" cy="20" r="1.4"/></svg><p>暂无下单记录</p></div>';
    } else {
      list.forEach(function (o) {
        var d = document.createElement('div');
        d.className = 'card';
        d.innerHTML =
          '<div class="card-head"><span class="order-no">订单号 ' + (o.id || '') + '</span><span class="status">' + (o.status || '待上级审核') + '</span></div>' +
          '<div class="main">' +
            '<div class="img"><img src="' + (o.img || '') + '" alt=""></div>' +
            '<div class="info">' +
              '<div class="name">' + (o.item || '温馨提示养护礼盒') + '</div>' +
              '<div class="meta">下单时间 ' + (o.date || '') + '</div>' +
              '<div class="price">实付 <b><span class="yen">¥</span>' + (o.price || '399.00') + '</b></div>' +
            '</div>' +
          '</div>';
        wrap.appendChild(d);
      });
    }
  </script>
</div>
</body>
</html>
