<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>我的</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: #e9e9e9;
    color: #1a1a1a;
    -webkit-font-smoothing: antialiased;
  }
  a { text-decoration: none; color: inherit; }
  button { border: none; background: none; cursor: pointer; font-family: inherit; }

  .page {
    max-width: 414px;
    margin: 0 auto;
    min-height: 100vh;
    background: #F5F5F5;
    padding-bottom: 96px;
    position: relative;
    overflow: hidden;
  }

  /* ---------- 渐变头部 ---------- */
  .hero {
    position: relative;
    background: linear-gradient(100deg, #394621 0%, #2D5016 52%, #4A5D23 100%);
    padding: 16px 16px 74px;
    color: #fff;
  }
  .hero::after {
    /* 底部弧形 */
    content: '';
    position: absolute;
    left: -10%; right: -10%; bottom: -30px;
    height: 90px;
    background: #F5F5F5;
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  }
  .hero-top { display: flex; align-items: center; justify-content: flex-end; gap: 16px; padding: 4px 6px 0; }
  .hero-icon { width: 25px; height: 25px; opacity: .95; transition: opacity .15s; }
  .hero-icon:active { opacity: .6; }

  .user-row { display: flex; align-items: center; gap: 14px; margin-top: 18px; }
  .avatar {
    width: 62px; height: 62px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.85);
    object-fit: cover;
    background: #ddd;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(0,0,0,.18);
  }
  .user-name { font-size: 19px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .vip-tag {
    display: inline-flex; align-items: center; gap: 4px;
    background: linear-gradient(135deg, #F7E6B2, #EED489);
    border: 1px solid rgba(180,140,60,.5);
    color: #8a6420;
    font-size: 11px; font-weight: 600;
    padding: 3px 8px;
    border-radius: 6px;
    box-shadow: 0 2px 6px rgba(0,0,0,.12);
  }
  .vip-tag svg { width: 13px; height: 13px; }

  /* ---------- 数据统计卡片 ---------- */
  .stat-card {
    position: relative;
    z-index: 5;
    margin: -46px 16px 0;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,.07);
    display: flex;
    padding: 18px 0;
  }
  .stat-item { flex: 1; text-align: center; position: relative; }
  .stat-item + .stat-item::before {
    content: '';
    position: absolute; left: 0; top: 50%; transform: translateY(-50%);
    width: 1px; height: 30px;
    background: #eee;
  }
  .stat-num { font-size: 22px; font-weight: 700; color: #1a1a1a; line-height: 1; }
  .stat-label { font-size: 12.5px; color: #666; margin-top: 7px; }

  /* ---------- 通用卡片区块 ---------- */
  .block {
    margin: 14px 16px 0;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 2px 10px rgba(0,0,0,.04);
    padding: 16px 16px 6px;
  }
  .block-head {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 6px;
  }
  .block-head h3 { font-size: 16.5px; font-weight: 700; color: #1a1a1a; }
  .block-head a { font-size: 12.5px; color: #999; display: flex; align-items: center; }
  .block-head a svg { width: 12px; height: 12px; margin-left: 2px; }

  .row-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    padding: 12px 0 14px;
  }
  .row-item {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    transition: transform .15s;
  }
  .row-item:active { transform: scale(.94); }
  .row-item svg { width: 28px; height: 28px; color: #333; }
  .row-item span { font-size: 12px; color: #666; }

  .tool-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    row-gap: 18px;
    padding: 12px 0 16px;
  }

  /* ---------- 底部导航 ---------- */
  .tabbar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 414px;
    background: #fff;
    border-top: 1px solid #eee;
    display: flex;
    padding: 7px 0 calc(14px + env(safe-area-inset-bottom));
    z-index: 100;
  }
  .tab {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 10px; color: #999;
  }
  .tab svg { width: 24px; height: 24px; }
  .tab.active { color: #394621; font-weight: 600; }
</style>
